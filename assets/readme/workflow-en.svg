<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Two active workflows, one typed runtime</title>
  <desc id="desc">Existing Figma edits and pages built from an actual reference are active. No-reference Greenfield is retained as a paused legacy path. Editable adaptation, strict fidelity, and human acceptance are separate outcomes.</desc>
  <rect width="1200" height="760" fill="#F4EFE2"/>
  <defs>
    <pattern id="grain" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A69E8D" opacity=".52"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#7389A3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
  </defs>
  <rect x="0" y="0" width="18" height="760" fill="url(#grain)"/>
  <text x="62" y="54" class="mono" font-size="15" font-weight="700" letter-spacing="1.6" fill="#7389A3">AI2FIGMA / CURRENT SCOPE</text>
  <text x="62" y="111" class="sans" font-size="46" font-weight="740" letter-spacing="-.7" fill="#211F1B">Two active workflows · one typed runtime</text>
  <text x="64" y="149" class="sans" font-size="21" font-weight="450" fill="#615D54">Existing edits and new pages based on real reference material remain in scope.</text>
  <path d="M62 174H1138" stroke="#B7AE9E" stroke-width="1.2"/>

  <circle cx="85" cy="219" r="23" fill="url(#grain)" stroke="#211F1B" stroke-width="1.6"/>
  <text x="85" y="225" class="mono" font-size="16" font-weight="700" text-anchor="middle" fill="#211F1B">01</text>
  <text x="125" y="214" class="sans" font-size="31" font-weight="720" fill="#211F1B">Existing edits</text>
  <text x="127" y="242" class="sans" font-size="16" font-weight="500" fill="#615D54">A supplied Figma page or selected nodes</text>
  <g fill="#FCF9F0" stroke="#B7AE9E" stroke-width="1.2">
    <rect x="350" y="272" width="162" height="58" rx="13"/><rect x="562" y="272" width="162" height="58" rx="13"/><rect x="774" y="272" width="162" height="58" rx="13"/><rect x="986" y="272" width="162" height="58" rx="13"/>
  </g>
  <g class="sans" font-size="17" font-weight="650" text-anchor="middle" fill="#211F1B">
    <text x="431" y="307">Inspect</text><text x="643" y="307">Scope the change</text><text x="855" y="307">Typed transaction</text><text x="1067" y="307">Read back + review</text>
  </g>
  <g stroke="#7389A3" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M517 301H550"/><path d="M729 301H762"/><path d="M941 301H974"/></g>
  <path d="M62 357H1138" stroke="#D0C8B9" stroke-width="1"/>

  <circle cx="85" cy="407" r="23" fill="url(#grain)" stroke="#211F1B" stroke-width="1.6"/>
  <text x="85" y="413" class="mono" font-size="16" font-weight="700" text-anchor="middle" fill="#211F1B">02</text>
  <text x="125" y="402" class="sans" font-size="31" font-weight="720" fill="#211F1B">Reference-led page</text>
  <text x="127" y="430" class="sans" font-size="16" font-weight="500" fill="#615D54">An actual local image or supplied Figma material</text>
  <g fill="#FCF9F0" stroke="#7389A3" stroke-width="1.4">
    <rect x="350" y="460" width="162" height="58" rx="13"/><rect x="562" y="460" width="162" height="58" rx="13"/><rect x="774" y="460" width="162" height="58" rx="13"/><rect x="986" y="460" width="162" height="58" rx="13"/>
  </g>
  <g class="sans" font-size="17" font-weight="650" text-anchor="middle" fill="#211F1B">
    <text x="431" y="495">Measure + map</text><text x="643" y="495">Decompose</text><text x="855" y="495">Build native layers</text><text x="1067" y="495">Review / refine</text>
  </g>
  <g stroke="#7389A3" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M517 489H550"/><path d="M729 489H762"/><path d="M941 489H974"/></g>

  <path d="M62 555H1138" stroke="#B7AE9E" stroke-width="1.2"/>
  <rect x="63" y="584" width="190" height="34" rx="17" fill="#E4DDD0" stroke="#9E9688" stroke-width="1"/>
  <text x="158" y="606" class="mono" font-size="13" font-weight="700" letter-spacing=".8" text-anchor="middle" fill="#615D54">LEGACY / PAUSED</text>
  <text x="286" y="599" class="sans" font-size="24" font-weight="700" fill="#615D54">No-reference Greenfield</text>
  <text x="287" y="627" class="sans" font-size="16" font-weight="450" fill="#777064">Brief-only development is paused; existing implementation and records are retained.</text>

  <rect x="62" y="671" width="8" height="50" fill="url(#grain)"/>
  <text x="88" y="690" class="sans" font-size="16" font-weight="600" fill="#211F1B">A new page from a real supplied reference remains active (`reference_greenfield`).</text>
  <text x="88" y="718" class="sans" font-size="16" font-weight="500" fill="#615D54">Editable adaptation ≠ strict fidelity ≠ human acceptance.</text>
</svg>
