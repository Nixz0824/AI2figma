<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">How the typed runtime reaches Figma</title>
  <desc id="desc">System map: the Agent Host uses MCP and a typed local bridge to call the Figma plugin; the plugin writes native editable nodes, while runtime and document state produce write-once evidence.</desc>
