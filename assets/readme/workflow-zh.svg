<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">两条活跃工作流，同一类型化运行时</title>
  <desc id="desc">修改现有 Figma 页面和根据真实参考新建页面仍在范围内。无参考 Greenfield 保留为已暂停的历史路径。可编辑适配、严格源保真与人类验收是不同结果。</desc>
  <rect width="1200" height="760" fill="#F4EFE2"/>
  <defs>
    <pattern id="grain" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A69E8D" opacity=".52"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#7389A3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
  </defs>
  <rect x="0" y="0" width="18" height="760" fill="url(#grain)"/>
  <text x="62" y="54" class="mono" font-size="15" font-weight="700" letter-spacing="1.6" fill="#7389A3">AI2FIGMA / 当前范围</text>
  <text x="62" y="111" class="sans" font-size="46" font-weight="740" letter-spacing="-.7" fill="#211F1B">两条活跃工作流 · 同一类型化运行时</text>
  <text x="64" y="149" class="sans" font-size="21" font-weight="450" fill="#615D54">Existing 编辑与基于真实参考的新页面仍在当前范围内。</text>
  <path d="M62 174H1138" stroke="#B7AE9E" stroke-width="1.2"/>

  <circle cx="85" cy="219" r="23" fill="url(#grain)" stroke="#211F1B" stroke-width="1.6"/>
  <text x="85" y="225" class="mono" font-size="16" font-weight="700" text-anchor="middle" fill="#211F1B">01</text>
  <text x="125" y="214" class="sans" font-size="31" font-weight="720" fill="#211F1B">Existing 编辑</text>
  <text x="127" y="242" class="sans" font-size="16" font-weight="500" fill="#615D54">用户提供的 Figma 页面或选中节点</text>
  <g fill="#FCF9F0" stroke="#B7AE9E" stroke-width="1.2">
    <rect x="350" y="272" width="162" height="58" rx="13"/><rect x="562" y="272" width="162" height="58" rx="13"/><rect x="774" y="272" width="162" height="58" rx="13"/><rect x="986" y="272" width="162" height="58" rx="13"/>
  </g>
  <g class="sans" font-size="17" font-weight="650" text-anchor="middle" fill="#211F1B">
    <text x="431" y="307">检查页面</text><text x="643" y="307">限定修改范围</text><text x="855" y="307">类型化事务</text><text x="1067" y="307">读回与复核</text>
  </g>
  <g stroke="#7389A3" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M517 301H550"/><path d="M729 301H762"/><path d="M941 301H974"/></g>
  <path d="M62 357H1138" stroke="#D0C8B9" stroke-width="1"/>

  <circle cx="85" cy="407" r="23" fill="url(#grain)" stroke="#211F1B" stroke-width="1.6"/>
  <text x="85" y="413" class="mono" font-size="16" font-weight="700" text-anchor="middle" fill="#211F1B">02</text>
  <text x="125" y="402" class="sans" font-size="31" font-weight="720" fill="#211F1B">参考新页面</text>
  <text x="127" y="430" class="sans" font-size="16" font-weight="500" fill="#615D54">用户实际提供的本地图片或 Figma 材料</text>
  <g fill="#FCF9F0" stroke="#7389A3" stroke-width="1.4">
    <rect x="350" y="460" width="162" height="58" rx="13"/><rect x="562" y="460" width="162" height="58" rx="13"/><rect x="774" y="460" width="162" height="58" rx="13"/><rect x="986" y="460" width="162" height="58" rx="13"/>
  </g>
  <g class="sans" font-size="17" font-weight="650" text-anchor="middle" fill="#211F1B">
    <text x="431" y="495">测量与映射</text><text x="643" y="495">语义分解</text><text x="855" y="495">构建原生图层</text><text x="1067" y="495">复核与修正</text>
  </g>
  <g stroke="#7389A3" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M517 489H550"/><path d="M729 489H762"/><path d="M941 489H974"/></g>

  <path d="M62 555H1138" stroke="#B7AE9E" stroke-width="1.2"/>
  <rect x="63" y="584" width="190" height="34" rx="17" fill="#E4DDD0" stroke="#9E9688" stroke-width="1"/>
  <text x="158" y="606" class="mono" font-size="13" font-weight="700" letter-spacing=".8" text-anchor="middle" fill="#615D54">历史路径 / 已暂停</text>
  <text x="286" y="599" class="sans" font-size="24" font-weight="700" fill="#615D54">无参考 Greenfield</text>
  <text x="287" y="627" class="sans" font-size="16" font-weight="450" fill="#777064">仅按 brief 创建页面的开发已暂停；保留现有实现与记录。</text>

  <rect x="62" y="671" width="8" height="50" fill="url(#grain)"/>
  <text x="88" y="690" class="sans" font-size="16" font-weight="600" fill="#211F1B">使用真实参考创建新页面（`reference_greenfield`）仍在范围内。</text>
  <text x="88" y="718" class="sans" font-size="16" font-weight="500" fill="#615D54">可编辑适配 ≠ 严格源保真 ≠ 人类验收。</text>
</svg>
